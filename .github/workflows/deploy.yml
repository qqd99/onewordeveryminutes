name: Deploy Vocabulary SRS to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # The deployed browser config is intentionally public. Keep the live
      # Gemini key out of git so GitHub secret scanning remains enabled.
      - name: Write public client image configuration
        env:
          PUBLIC_GEMINI_KEY: ${{ secrets.GEMINI_IMAGE_API_KEY }}
          IMAGE_APPROVAL_ENDPOINT: ${{ vars.AI_IMAGE_APPROVAL_ENDPOINT }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const config = {
            geminiKey: process.env.PUBLIC_GEMINI_KEY || '',
            approvalEndpoint: process.env.IMAGE_APPROVAL_ENDPOINT || ''
          };
          fs.writeFileSync('web/ai-image-config.js',
            'window.AI_IMAGE_CONFIG = ' + JSON.stringify(config) + ';\n');
          NODE

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # If hosted from the web subfolder
          path: 'web/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
